

services:

  postgres:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_DB: social_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
